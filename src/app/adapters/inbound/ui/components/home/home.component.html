<div class="table-container">
  <div class="table-top">
	<h2>Contatos</h2>
	<div class="table-top-fields">
		<input type="text" id="search" name="search" placeholder="Search">
		<button id="btn-add" (click)="addContact()">Adicionar</button>
	</div>
  </div>
  <table class="custom-table">
    <thead>
      <tr>
        <th>Name</th>
        <th>Surname</th>
        <th>E-mail</th>
        <th>Phone</th>
        <th>Twitter</th>
		<th>Skype</th>
		<th>Attachment</th>
		<th></th>
		<th></th>
      </tr>
    </thead>
    <tbody>
      <tr *ngFor="let contact of contacts">
        <td>{{ contact.name }}</td>
        <td>{{ contact.surname }}</td>
        <td>{{ contact.email }}</td>
        <td>{{ contact.phone }}</td>
        <td>{{ contact.twitterLink || 'No Twitter' }}</td>
        <td>{{ contact.skypeContact || 'No Skype' }}</td>
        <td><button (click)="seeFile(contact)">See</button></td>
		<td><button>Update</button></td>
		<td><button (click)="deleteContact(contact.id)">Delete</button></td>
      </tr>
    </tbody>
  </table>
  <div *ngIf="errorMessage" style="color: red;">{{ errorMessage }}</div>
  <!--<pre>{{ contacts | json }}</pre>-->
</div>
<app-toast #toastRef></app-toast>

@if(!isDisabledSideSheet) {
	<app-side-sheet (closeAll)="makeClose()" (parentContactSelected)="receiveContact($event)"></app-side-sheet>
}
